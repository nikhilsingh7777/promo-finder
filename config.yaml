# All tunables live here. Model IDs are placeholders: set real ones before running.
# Any LiteLLM model string works (e.g. "<provider>/<model-id>"); swap models here, never in code.
models:
  # Check what your key can use with: python -m promo_finder models
  # Override any role without editing this file: PROMO_MODEL_PROPOSER=..., or PROMO_MODEL=... for all.
  # Free tier (checked on ai.dev/rate-limit, 2026-11-06): each strong Flash model = 20 requests/day,
  # 3.1-flash-lite = 500/day. So strong models only propose (rotating to add up their quotas);
  # lite judges and plays the blind viewer. 2.5-flash is 404 for new keys.
  proposer: "gemini/gemini-3.5-flash"
  judge: "gemini/gemini-3.1-flash-lite"         # different model from proposer: no self-grading
  blind_viewer: "gemini/gemini-3.1-flash-lite"  # cheap model reads the clip "cold"
  roster: "gemini/gemini-3.5-flash"
  editor: "gemini/gemini-3.5-flash"
  # Per-role fallback chains, tried in order when a model is out of quota or overloaded.
  # Strong models first; groq/* is used only if GROQ_API_KEY is set; the lite model is the
  # last resort so a free-tier run can finish in one day. Every candidate records which model
  # proposed it (column proposer_model), see docs/model_comparison.md for the quality gap.
  fallbacks:
    proposer: ["gemini/gemini-3-flash-preview", "gemini/gemini-3.8-flash",
               "gemini/gemini-3.7-flash", "gemini/gemini-3.6-flash", "gemini/gemini-flash-latest",
               "groq/openai/gpt-oss-120b", "gemini/gemini-3.1-flash-lite"]
    editor: ["gemini/gemini-3-flash-preview", "gemini/gemini-3.8-flash",
             "gemini/gemini-3.7-flash", "gemini/gemini-3.1-flash-lite"]
    judge: ["gemini/gemini-3-flash-preview", "gemini/gemini-3.8-flash"]
    blind_viewer: ["gemini/gemini-3-flash-preview"]
    roster: ["gemini/gemini-3-flash-preview", "gemini/gemini-3.8-flash"]
  api_base: null                                # optional OpenAI-compatible endpoint override

llm:
  temperature_proposer: 0.3
  temperature_judge: 0.0
  max_retries: 2
  preflight_timeout_s: 30
  timeout_s: 90                                 # per call; a hung request fails instead of blocking
  requests_per_minute: 8                        # free tier is ~5-10 RPM per project
  concurrency: 2
  cache_dir: "cache/"

promo_rules:
  min_duration_s: 20
  max_duration_s: 60
  target_min_s: 28
  target_max_s: 56
  hook_window_s: 3.0
  cliff_tail_max_s: 4.0          # clip must end within this long after the cliffhanger
  after_cut_events: 3            # lines shown to the judge from right after the cut
  max_segments: 3
  lead_in_s: 0.3
  tail_s: 0.4
  dedupe_iou: 0.3

generation:
  max_candidates_per_episode: 3
  context_prev_episodes: 4
  spoiler_lookahead_episodes: 3   # judge checks spoilers against this many later loglines
  repair_attempts: 2

ranking:
  final_n: 30                     # highlighted in ranking_report.md; CSV/JSON hold ALL ranked promos
  editor_note_top_k: 10
  weights:
    hook: 0.30
    cliffhanger: 0.25
    standalone: 0.20
    emotion_share: 0.15
    spoiler_safety: 0.10
  penalties:
    answer_inside_clip: 0.10      # judge says the clip already resolves its own question
    blind_not_understood: 0.08    # cold viewer could not follow it
    blind_not_hooked: 0.05        # cold viewer would not tap to watch
    edge_duration: 0.03           # valid but outside the 28-56 s comfort band
  same_episode_penalty: 0.04      # diversity: each earlier pick from the same episode costs this
  early_episode_max: 5            # assumption: promos from the first episodes onboard best
  early_episode_bonus: 0.03

paths:
  episodes: "data/episodes"
  outputs: "outputs"
